name: refresh stats

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:          # deliberately no `push` trigger -- this job commits,
                               # and a push trigger would re-run it on its own commit
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: generate stats svgs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/generate_stats.py

      - name: bust cache in README
        # GitHub caches the *rendered profile page*, not just the image
        # bytes -- a run that only changes the SVGs never touches
        # README.md, so the page never re-renders and visitors keep
        # seeing the old graphics indefinitely. See scripts/bust_cache.py.
        run: |
          FILES="assets/stats.svg assets/streak.svg assets/langs.svg assets/year.svg"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "no change, skipping"
            exit 0
          fi
          python3 scripts/bust_cache.py "$GITHUB_SHA"

      - name: commit if changed
        run: |
          FILES="assets/stats.svg assets/streak.svg assets/langs.svg assets/year.svg README.md"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "no change, skipping commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $FILES
          git commit -m "stats: refresh"
          git push
